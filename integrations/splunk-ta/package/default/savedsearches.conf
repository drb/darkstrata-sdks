# DarkStrata Technology Add-on - Saved Searches Configuration
# Includes threat intel KV store population and correlation searches

# =============================================================================
# THREAT INTEL KV STORE POPULATION
# These searches populate ES Threat Intel Framework lookups from DarkStrata data
# =============================================================================

#
# Populate Email Intelligence KV Store
# Extracts compromised email addresses from observed-data events
#
[DarkStrata - Populate Email Intel]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = */15 * * * *
description = Populates the DarkStrata email intelligence KV store from observed-data events. Runs every 15 minutes.
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="objects.0.account_type" output=account_type \
    | where account_type="email" \
    | spath path="objects.0.account_login" output=email \
    | spath path="objects.1.value" output=domain \
    | spath path="labels{}" output=labels \
    | eval source_type=if(match(mvjoin(labels,","),"source:malware"),"malware","breach") \
    | eval flow_direction=if(match(mvjoin(labels,","),"flow:inbound"),"inbound","outbound") \
    | eval threat_key=email \
    | eval description="Compromised credential: ".email." on ".domain." (source: ".source_type.", flow: ".flow_direction.")" \
    | eval weight=case(match(mvjoin(labels,","),"severity-critical"),100, match(mvjoin(labels,","),"severity-high"),80, match(mvjoin(labels,","),"severity-medium"),60, match(mvjoin(labels,","),"severity-low"),40, 1=1, 20) \
    | stats earliest(_time) as first_seen, latest(_time) as last_seen, values(domain) as domains, max(weight) as weight by email, threat_key, source_type, flow_direction \
    | eval description="Compromised credential found in ".source_type." (".flow_direction." flow). Affected services: ".mvjoin(domains,", ") \
    | table email, description, threat_key, weight, first_seen, last_seen, source_type, flow_direction \
    | outputlookup append=t darkstrata_email_intel

#
# Populate Domain Intelligence KV Store
# Extracts domains associated with credential exposures
#
[DarkStrata - Populate Domain Intel]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = */15 * * * *
description = Populates the DarkStrata domain intelligence KV store. Runs every 15 minutes.
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="objects.1.value" output=domain \
    | spath path="labels{}" output=labels \
    | eval source_type=if(match(mvjoin(labels,","),"source:malware"),"malware","breach") \
    | eval threat_key=domain \
    | eval weight=case(match(mvjoin(labels,","),"severity-critical"),100, match(mvjoin(labels,","),"severity-high"),80, match(mvjoin(labels,","),"severity-medium"),60, match(mvjoin(labels,","),"severity-low"),40, 1=1, 20) \
    | stats earliest(_time) as first_seen, latest(_time) as last_seen, dc(objects.0.account_login) as affected_users, max(weight) as weight by domain, threat_key, source_type \
    | eval description="Domain associated with ".affected_users." compromised credentials (source: ".source_type.")" \
    | table domain, description, threat_key, weight, first_seen, last_seen \
    | outputlookup append=t darkstrata_domain_intel

#
# Populate User Intelligence KV Store
# Extracts compromised usernames (non-email identifiers)
#
[DarkStrata - Populate User Intel]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = */15 * * * *
description = Populates the DarkStrata user intelligence KV store. Runs every 15 minutes.
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="objects.0.account_type" output=account_type \
    | spath path="objects.0.account_login" output=user \
    | spath path="objects.1.value" output=domain \
    | spath path="labels{}" output=labels \
    | eval source_type=if(match(mvjoin(labels,","),"source:malware"),"malware","breach") \
    | eval flow_direction=if(match(mvjoin(labels,","),"flow:inbound"),"inbound","outbound") \
    | eval threat_key=user \
    | eval email=if(account_type="email",user,null()) \
    | eval weight=case(match(mvjoin(labels,","),"severity-critical"),100, match(mvjoin(labels,","),"severity-high"),80, match(mvjoin(labels,","),"severity-medium"),60, match(mvjoin(labels,","),"severity-low"),40, 1=1, 20) \
    | stats earliest(_time) as first_seen, latest(_time) as last_seen, values(domain) as domains, max(weight) as weight, values(email) as email by user, threat_key, source_type, flow_direction \
    | eval description="Compromised user credential (source: ".source_type.", flow: ".flow_direction.")" \
    | table user, description, threat_key, weight, first_seen, last_seen, email \
    | outputlookup append=t darkstrata_user_intel


# =============================================================================
# CORRELATION SEARCHES FOR ENTERPRISE SECURITY
# These create notable events when threat conditions are detected
# =============================================================================

#
# Critical/High Severity Credential Exposure
# Triggers when new critical or high severity credentials are detected
#
[DarkStrata - Critical Credential Exposure Detected]
action.correlationsearch.annotations = {"mitre_attack":["T1589.001"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Critical Credential Exposure
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View in DarkStrata
action.notable.param.drilldown_search = sourcetype="darkstrata:stix:observed-data" | search user="$user$"
action.notable.param.rule_description = A critical or high severity credential exposure was detected by DarkStrata. This indicates a compromised credential that poses significant risk and requires immediate attention.
action.notable.param.rule_title = DarkStrata: Critical Credential Exposure - $user$ on $dest$
action.notable.param.security_domain = identity
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_object = user
action.risk.param._risk_object_type = user
action.risk.param._risk_score = 80
alert.track = 1
cron_schedule = */5 * * * *
description = Detects new critical or high severity credential exposures from DarkStrata. Triggers notable event in ES.
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="labels{}" output=labels \
    | where match(mvjoin(labels,","),"severity-critical") OR match(mvjoin(labels,","),"severity-high") \
    | spath path="objects.0.account_login" output=user \
    | spath path="objects.1.value" output=dest \
    | eval source_type=if(match(mvjoin(labels,","),"source:malware"),"Malware/Infostealer","Data Breach") \
    | eval severity=if(match(mvjoin(labels,","),"severity-critical"),"critical","high") \
    | eval signature="Credential Exposure: ".user." on ".dest \
    | eval app="darkstrata" \
    | table _time, user, dest, source_type, severity, signature, app, mitre_technique_id, annotations.mitre_attack

#
# Malware-Sourced Credential Detection
# Triggers when credentials sourced from malware/infostealers are detected
#
[DarkStrata - Malware Credential Detected]
action.correlationsearch.annotations = {"mitre_attack":["T1555.003","T1589.001"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Malware Credential
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View Malware Indicators
action.notable.param.drilldown_search = sourcetype="darkstrata:stix:observed-data" labels="*source:malware*" | search user="$user$"
action.notable.param.rule_description = A credential sourced from malware (infostealer, keylogger) was detected. This indicates an active compromise of the user's device.
action.notable.param.rule_title = DarkStrata: Malware-Sourced Credential - $user$
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.risk = 1
action.risk.param._risk_object = user
action.risk.param._risk_object_type = user
action.risk.param._risk_score = 100
alert.track = 1
cron_schedule = */5 * * * *
description = Detects credentials sourced from malware/infostealers - indicates active device compromise.
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="labels{}" output=labels \
    | where match(mvjoin(labels,","),"source:malware") \
    | spath path="objects.0.account_login" output=user \
    | spath path="objects.1.value" output=dest \
    | eval signature="Malware-sourced credential: ".user \
    | eval app="darkstrata" \
    | eval threat_category="malware" \
    | table _time, user, dest, signature, app, threat_category, mitre_technique_id, annotations.mitre_attack

#
# Outbound Credential Exposure (Third-Party Risk)
# Detects corporate credentials used on third-party services
#
[DarkStrata - Third Party Credential Exposure]
action.correlationsearch.annotations = {"mitre_attack":["T1589.001"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Third Party Exposure
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View Third Party Exposures
action.notable.param.drilldown_search = sourcetype="darkstrata:stix:observed-data" labels="*flow:outbound*"
action.notable.param.rule_description = Corporate credentials were found exposed on third-party services. This indicates password reuse on external sites.
action.notable.param.rule_title = DarkStrata: Corporate Credential on Third-Party - $user$ on $dest$
action.notable.param.security_domain = identity
action.notable.param.severity = medium
action.risk = 1
action.risk.param._risk_object = user
action.risk.param._risk_object_type = user
action.risk.param._risk_score = 50
alert.track = 1
cron_schedule = */15 * * * *
description = Detects corporate credentials exposed on third-party services (outbound flow).
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="labels{}" output=labels \
    | where match(mvjoin(labels,","),"flow:outbound") \
    | spath path="objects.0.account_login" output=user \
    | spath path="objects.1.value" output=dest \
    | eval signature="Third-party credential exposure: ".user." on ".dest \
    | eval app="darkstrata" \
    | stats count as exposure_count, values(dest) as affected_services, values(mitre_technique_id) as mitre_technique_id, values(annotations.mitre_attack) as annotations.mitre_attack by user \
    | where exposure_count > 0 \
    | table _time, user, affected_services, exposure_count, mitre_technique_id, annotations.mitre_attack

#
# Multiple Users from Same Source (Campaign Detection)
# Detects potential malware campaigns affecting multiple users
#
[DarkStrata - Potential Malware Campaign]
action.correlationsearch.annotations = {"mitre_attack":["T1555.003","T1589.001"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Malware Campaign
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View Campaign Details
action.notable.param.drilldown_search = sourcetype="darkstrata:stix:observed-data" labels="*source:malware*" earliest=-1h
action.notable.param.rule_description = Multiple users have credentials exposed from the same malware source within a short time period, indicating a potential malware campaign.
action.notable.param.rule_title = DarkStrata: Potential Malware Campaign - $affected_user_count$ users affected
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_score = 90
alert.track = 1
cron_schedule = 0 * * * *
description = Detects multiple users affected by malware credentials in a short time period.
dispatch.earliest_time = -1h@h
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="labels{}" output=labels \
    | where match(mvjoin(labels,","),"source:malware") \
    | spath path="objects.0.account_login" output=user \
    | stats dc(user) as affected_user_count, values(user) as affected_users, values(mitre_technique_id) as mitre_technique_id, values(annotations.mitre_attack) as annotations.mitre_attack \
    | where affected_user_count >= 3 \
    | eval signature="Potential malware campaign: ".affected_user_count." users affected" \
    | table _time, affected_user_count, affected_users, signature, mitre_technique_id, annotations.mitre_attack

#
# New Alert Bundle Detected
# Triggers when a new DarkStrata alert is received
#
[DarkStrata - New Alert Received]
action.email.useNSSubject = 1
alert.track = 1
cron_schedule = */5 * * * *
description = Monitors for new DarkStrata alert bundles and logs them for tracking.
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:alert" \
    | spath path="objects{}.type" output=object_types \
    | where mvfind(object_types,"report")>=0 \
    | spath path="objects{}" output=objects \
    | mvexpand objects \
    | spath input=objects path=type output=obj_type \
    | where obj_type="report" \
    | spath input=objects path=name output=alert_name \
    | spath input=objects path=published output=published \
    | spath input=objects path=labels{} output=labels \
    | eval severity=case(match(mvjoin(labels,","),"severity-critical"),"critical", match(mvjoin(labels,","),"severity-high"),"high", match(mvjoin(labels,","),"severity-medium"),"medium", match(mvjoin(labels,","),"severity-low"),"low", 1=1,"info") \
    | table _time, alert_name, published, severity


# =============================================================================
# GHOST (HONEYTOKEN) CORRELATION SEARCHES
# Read darkstrata:ghost:event from the DarkStrata Ghost Events input. They look
# back 30 days (the feed's retention) but only at events indexed in the last
# 10 minutes, so a late or backfilled event is still caught; throttling on
# event_id stops the overlap raising a second notable. Test events are ignored.
# ghost_label and the match fields are customer- or leak-supplied text: they
# appear in results only and are never placed in a drilldown search.
# =============================================================================

#
# Ghost Seen
# A ghost (honey identity) was found in leaked data: someone holds it.
#
[DarkStrata - Ghost Seen]
action.correlationsearch.annotations = {"mitre_attack":["T1589.001","T1589.002"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Ghost Seen
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View ghost events
action.notable.param.drilldown_search = sourcetype="darkstrata:ghost:event" ghost.id="$ghost_id$"
action.notable.param.rule_description = A DarkStrata ghost (a honeytoken identity that no real person uses) was found in leaked data. Whoever holds it obtained it from your environment or a supplier it was seeded to. Open the event's console_url in DarkStrata for the match details.
action.notable.param.rule_title = DarkStrata: Ghost seen - $user$ ($subtype$)
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_object = user
action.risk.param._risk_object_type = user
action.risk.param._risk_score = 80
alert.suppress = 1
alert.suppress.fields = event_id
alert.suppress.period = 86400s
alert.track = 1
cron_schedule = */5 * * * *
description = Raises a notable for each ghost.seen event (ghost found in leaked data). Severity, risk score and ATT&CK techniques come from the event.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:ghost:event" event_type="ghost.seen" is_test=false _index_earliest=-10m@m _index_latest=now \
    | eval risk_score=case(severity="critical",100, severity="high",80, severity="medium",60, severity="low",40, 1=1,20) \
    | rename match.corpus_name as match_corpus_name \
    | table _time, event_id, seq, ghost_id, ghost_label, ghost_kind, user, dest, signature, subtype, severity, risk_score, match_source, match_corpus_name, console_url, vendor_product, mitre_technique_id, mitre_tactic_id, annotations.mitre_attack

#
# Ghost Retired
# A ghost was retired. Usually a deliberate change by your team, but retiring
# ghosts (or deleting the domain they belong to) also silences the tripwire, so
# confirm each retirement with retired_by.
#
[DarkStrata - Ghost Retired]
action.correlationsearch.annotations = {"mitre_attack":["T1562"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Ghost Retired
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View ghost events
action.notable.param.drilldown_search = sourcetype="darkstrata:ghost:event" ghost.id="$ghost_id$"
action.notable.param.rule_description = A DarkStrata ghost was retired, so it no longer raises alerts. Confirm with the person in retired_by that the change was intended; an unexpected retirement may be an attempt to disable your honeytokens.
action.notable.param.rule_title = DarkStrata: Ghost retired - $ghost_id$
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.risk = 0
alert.suppress = 1
alert.suppress.fields = event_id
alert.suppress.period = 86400s
alert.track = 1
cron_schedule = */5 * * * *
description = Tamper alarm: raises a medium notable when a ghost is retired, so an unexpected retirement is checked.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:ghost:event" event_type="ghost.retired" is_test=false _index_earliest=-10m@m _index_latest=now \
    | rename retired_by.id as retired_by_id, retired_by.name as retired_by_name \
    | eval severity="medium", mitre_technique_id="T1562", annotations.mitre_attack="T1562" \
    | table _time, event_id, seq, ghost_id, ghost_label, ghost_kind, signature, severity, retired_by_id, retired_by_name, reason, console_url, vendor_product, mitre_technique_id, annotations.mitre_attack


#
# Ghost Proof of Life Missing
# DarkStrata sends ghost.verified on the 1st of each month for every armed
# ghost (domain enabled, verified and checked in the last 48 hours). A ghost
# that is neither retired nor verified in 33 days is no longer armed, or events
# have stopped arriving: either way its tripwire is silent. Looks back 62 days,
# so a ghost that has missed two months drops out (it alerted in between).
#
[DarkStrata - Ghost Proof of Life Missing]
action.correlationsearch.annotations = {"mitre_attack":["T1562"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Ghost Proof of Life Missing
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View ghost events
action.notable.param.drilldown_search = sourcetype="darkstrata:ghost:event" ghost.id="$ghost_id$"
action.notable.param.rule_description = A DarkStrata ghost has had no monthly proof of life (ghost.verified) for over 33 days, so it is no longer armed: its domain may be disabled, unverified or not being checked, or the Ghost Events input has stopped. Open console_url in DarkStrata to see why.
action.notable.param.rule_title = DarkStrata: Ghost not armed - $ghost_id$
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.risk = 0
alert.suppress = 1
alert.suppress.fields = ghost_id
alert.suppress.period = 604800s
alert.track = 1
cron_schedule = 0 9 * * *
description = Raises a medium notable for each ghost that is not retired and has had no ghost.verified (or ghost.deployed) event in 33 days.
dispatch.earliest_time = -62d@d
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:ghost:event" is_test=false event_type IN ("ghost.deployed", "ghost.verified", "ghost.retired") \
    | stats max(eval(if(event_type="ghost.verified", _time, null()))) as last_verified, max(eval(if(event_type="ghost.deployed", _time, null()))) as deployed_at, max(eval(if(event_type="ghost.retired", _time, null()))) as retired_at, latest(ghost_label) as ghost_label, latest(ghost_kind) as ghost_kind, latest(console_url) as console_url by ghost_id \
    | where isnull(retired_at) AND coalesce(last_verified, deployed_at) < relative_time(now(), "-33d") \
    | eval _time=coalesce(last_verified, deployed_at), signature="ghost.verified missing", severity="medium", mitre_technique_id="T1562", annotations.mitre_attack="T1562", vendor_product="DarkStrata Ghost" \
    | convert ctime(last_verified) ctime(deployed_at) \
    | table _time, ghost_id, ghost_label, ghost_kind, last_verified, deployed_at, signature, severity, console_url, vendor_product, mitre_technique_id, annotations.mitre_attack

# =============================================================================
# DC-SIDE HONEY-ACCOUNT SEARCHES (TEMPLATES, DISABLED BY DEFAULT)
# For honey accounts you create in Active Directory. They need Windows Security
# logs from your domain controllers (Splunk Add-on for Microsoft Windows) and do
# not use DarkStrata data. To enable one:
#   1. Create the honey account (an SPN account for Kerberoasting, or one with
#      "Do not require Kerberos preauthentication" for AS-REP roasting).
#   2. Add its sAMAccountName to lookups/darkstrata_honey_accounts.csv with
#      type "spn" or "asrep".
#   3. Point the darkstrata_windows_security macro at your DC index.
#   4. Enable the search.
# No legitimate process uses a honey account, so any match is hostile.
# =============================================================================

#
# Kerberoasting a honey SPN account (Windows event 4769)
#
[DarkStrata - Honey SPN Kerberos Service Ticket]
action.correlationsearch.annotations = {"mitre_attack":["T1558.003"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Honey SPN Kerberos Service Ticket
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View Kerberos service ticket requests from this source
action.notable.param.drilldown_search = `darkstrata_windows_security` EventCode=4769 (IpAddress="$src$" OR Client_Address="$src$")
action.notable.param.rule_description = A Kerberos service ticket (4769) was requested for a honey SPN account. Nothing legitimate uses this account, so the request is almost certainly Kerberoasting.
action.notable.param.rule_title = DarkStrata: Kerberoasting of honey account $honey_account$ from $src$
action.notable.param.security_domain = access
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_object = src
action.risk.param._risk_object_type = system
action.risk.param._risk_score = 80
alert.suppress = 1
alert.suppress.fields = src,honey_account
alert.suppress.period = 3600s
alert.track = 1
cron_schedule = */5 * * * *
description = Template (disabled): detects a Kerberos service ticket request (4769) for a honey SPN account listed in darkstrata_honey_accounts.csv.
disabled = 1
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
search = `darkstrata_windows_security` EventCode=4769 \
    | eval honey_account=lower(mvindex(split(coalesce(ServiceName, Service_Name), "@"), 0)) \
    | `darkstrata_honey_account("spn")` \
    | eval src=replace(coalesce(IpAddress, Client_Address), "^::ffff:", ""), user=coalesce(TargetUserName, mvindex(Account_Name, 0)), dest=host, ticket_encryption_type=coalesce(TicketEncryptionType, Ticket_Encryption_Type) \
    | eval signature="Kerberos service ticket for honey SPN account ".honey_account, severity="high", mitre_technique_id="T1558.003", annotations.mitre_attack="T1558.003" \
    | table _time, dest, src, user, honey_account, honey_account_description, ticket_encryption_type, signature, severity, mitre_technique_id, annotations.mitre_attack

#
# AS-REP roasting a honey account (Windows event 4768 without pre-authentication)
#
[DarkStrata - Honey Account AS-REP Roasting]
action.correlationsearch.annotations = {"mitre_attack":["T1558.004"]}
action.correlationsearch.enabled = 1
action.correlationsearch.label = DarkStrata - Honey Account AS-REP Roasting
action.email.useNSSubject = 1
action.notable = 1
action.notable.param.drilldown_name = View Kerberos TGT requests from this source
action.notable.param.drilldown_search = `darkstrata_windows_security` EventCode=4768 (IpAddress="$src$" OR Client_Address="$src$")
action.notable.param.rule_description = A Kerberos TGT (4768) was requested without pre-authentication for an AS-REP honey account. Nothing legitimate uses this account, so the request is almost certainly AS-REP roasting.
action.notable.param.rule_title = DarkStrata: AS-REP roasting of honey account $honey_account$ from $src$
action.notable.param.security_domain = access
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_object = src
action.risk.param._risk_object_type = system
action.risk.param._risk_score = 80
alert.suppress = 1
alert.suppress.fields = src,honey_account
alert.suppress.period = 3600s
alert.track = 1
cron_schedule = */5 * * * *
description = Template (disabled): detects a Kerberos TGT request without pre-authentication (4768, pre-auth type 0) for an AS-REP honey account listed in darkstrata_honey_accounts.csv.
disabled = 1
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
search = `darkstrata_windows_security` EventCode=4768 \
    | eval pre_auth_type=coalesce(PreAuthType, Pre_Authentication_Type) \
    | where pre_auth_type="0" \
    | eval honey_account=lower(mvindex(split(coalesce(TargetUserName, mvindex(Account_Name, 0)), "@"), 0)) \
    | `darkstrata_honey_account("asrep")` \
    | eval src=replace(coalesce(IpAddress, Client_Address), "^::ffff:", ""), user=honey_account, dest=host \
    | eval signature="Kerberos TGT without pre-authentication for honey account ".honey_account, severity="high", mitre_technique_id="T1558.004", annotations.mitre_attack="T1558.004" \
    | table _time, dest, src, user, honey_account, honey_account_description, pre_auth_type, signature, severity, mitre_technique_id, annotations.mitre_attack


# =============================================================================
# LOOKUP GENERATION SEARCHES
# Generate CSV lookups for threat intel correlation
# =============================================================================

#
# Generate email lookup for ES threat matching
#
[DarkStrata - Generate Email Lookup]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = 0 */4 * * *
description = Generates email lookup file for threat intel matching. Runs every 4 hours.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
search = sourcetype="darkstrata:stix:observed-data" \
    | spath path="objects.0.account_type" output=account_type \
    | where account_type="email" \
    | spath path="objects.0.account_login" output=email \
    | spath path="labels{}" output=labels \
    | eval weight=case(match(mvjoin(labels,","),"severity-critical"),100, match(mvjoin(labels,","),"severity-high"),80, match(mvjoin(labels,","),"severity-medium"),60, 1=1, 40) \
    | stats max(weight) as weight, latest(_time) as last_seen by email \
    | eval threat_key=email, description="Compromised email from DarkStrata" \
    | table email, threat_key, description, weight, last_seen \
    | outputlookup darkstrata_email_intel.csv
