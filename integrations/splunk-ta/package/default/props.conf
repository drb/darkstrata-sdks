# DarkStrata Technology Add-on - Props Configuration
# Defines sourcetypes and field extractions for DarkStrata threat intelligence

#
# STIX Observed-Data Sourcetype
# Used for individual compromised credential indicators
#
[darkstrata:stix:observed-data]
DATETIME_CONFIG =
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
TIME_PREFIX = "modified"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 40
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 999999

# Extract key fields from JSON
FIELDALIAS-stix_id = id AS stix_id
FIELDALIAS-stix_type = type AS stix_type

# Extract user account from nested objects
EVAL-user = spath(_raw, "objects.0.account_login")
EVAL-user_type = spath(_raw, "objects.0.account_type")
EVAL-dest = spath(_raw, "objects.1.value")

# Extract labels for filtering (KV_MODE=json names the label array labels{})
EVAL-source_type = if(match(mvjoin('labels{}', ","), "source:malware"), "malware", if(match(mvjoin('labels{}', ","), "source:breach"), "breach", "unknown"))
EVAL-flow_direction = if(match(mvjoin('labels{}', ","), "flow:inbound"), "inbound", if(match(mvjoin('labels{}', ","), "flow:outbound"), "outbound", "unknown"))

# MITRE ATT&CK techniques from mitre:<technique id> labels (see transforms.conf)
REPORT-mitre_technique_id = darkstrata_extract_mitre_technique
EVAL-mitre_technique_id = mvdedup(mitre_technique_id)
EVAL-mitre_technique = mvdedup(mitre_technique_id)
EVAL-annotations.mitre_attack = mvdedup(mitre_technique_id)

# CIM Threat Intelligence mapping
FIELDALIAS-threat_match_type = type AS threat_match_type
EVAL-threat_key = spath(_raw, "objects.0.account_login")
EVAL-threat_match_value = spath(_raw, "objects.1.value")

# CIM Authentication mapping (for credential exposure events)
FIELDALIAS-action = "success" AS action
EVAL-app = "darkstrata"
EVAL-authentication_method = "compromised_credential"
EVAL-signature = "Credential Exposure: ".spath(_raw, "objects.0.account_login")." on ".spath(_raw, "objects.1.value")


#
# STIX Alert Sourcetype
# Used for credential exposure alert bundles (contains report + indicators)
#
[darkstrata:stix:alert]
DATETIME_CONFIG =
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
TIME_PREFIX = "published"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 40
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 999999

# Extract bundle-level fields
FIELDALIAS-bundle_id = id AS bundle_id
FIELDALIAS-bundle_type = type AS bundle_type

# Extract report details from objects array
# Note: buildAlertBundle puts the report first, so it is objects{0}
EVAL-alert_name = json_extract(_raw, "objects{0}.name")
EVAL-alert_description = json_extract(_raw, "objects{0}.description")
EVAL-alert_severity = case(match(json_extract(_raw, "objects{0}.labels"), "severity-critical"), "critical", match(json_extract(_raw, "objects{0}.labels"), "severity-high"), "high", match(json_extract(_raw, "objects{0}.labels"), "severity-medium"), "medium", match(json_extract(_raw, "objects{0}.labels"), "severity-low"), "low", 1=1, "info")

# MITRE ATT&CK techniques, deduplicated across the bundle's observed-data labels
REPORT-mitre_technique_id = darkstrata_extract_mitre_technique
EVAL-mitre_technique_id = mvdedup(mitre_technique_id)
EVAL-mitre_technique = mvdedup(mitre_technique_id)
EVAL-annotations.mitre_attack = mvdedup(mitre_technique_id)

#
# Ghost Event Sourcetype
# Ghost (honeytoken) events from the /ghosts/events JSON feed, one envelope per
# event. ghost.label, match.corpus_name and match.provenance are customer- or
# leak-supplied text: use them as field values only, never to build SPL.
#
[darkstrata:ghost:event]
DATETIME_CONFIG =
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
TIME_PREFIX = "received_at"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 40
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 999999

FIELDALIAS-ghost_id = ghost.id AS ghost_id
FIELDALIAS-ghost_label = ghost.label AS ghost_label
FIELDALIAS-ghost_kind = kind AS ghost_kind
FIELDALIAS-match_source = match.source AS match_source
FIELDALIAS-user = ghost.email AS user

# CIM Intrusion Detection mapping (ghost.seen is tagged ids/attack in tags.conf)
EVAL-vendor = "DarkStrata"
EVAL-product = "Ghost"
EVAL-vendor_product = "DarkStrata Ghost"
EVAL-app = "darkstrata"
EVAL-dvc = "darkstrata"
EVAL-ids_type = "application"
EVAL-category = "honeytoken"
EVAL-action = "allowed"
EVAL-signature_id = event_type
EVAL-signature = if(isnotnull(subtype), event_type.":".subtype, event_type)
EVAL-severity = case(severity="CRITICAL", "critical", severity="HIGH", "high", severity="MEDIUM", "medium", severity="LOW", "low", severity="INFO", "informational")
EVAL-dest = coalesce(replace('ghost.email', "^[^@]*@", ""), 'ghost.id')
EVAL-user_type = if(isnotnull('ghost.email'), "email", null())

# MITRE ATT&CK techniques and tactics from the event's mitre block
EVAL-mitre_technique_id = mvdedup('mitre.techniques{}.id')
EVAL-mitre_technique = mvdedup('mitre.techniques{}.id')
EVAL-mitre_technique_name = mvdedup('mitre.techniques{}.name')
EVAL-mitre_tactic_id = mvdedup('mitre.techniques{}.tactic_ids{}')
EVAL-annotations.mitre_attack = mvdedup('mitre.techniques{}.id')


#
# Credential Exposure Sourcetype (future: data-intelligence endpoint)
#
[darkstrata:credential:exposure]
DATETIME_CONFIG =
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 999999

# CIM Identity Management mapping
EVAL-identity_type = "user"
FIELDALIAS-identity = email AS identity


#
# Default catch-all for DarkStrata events
#
[darkstrata]
DATETIME_CONFIG =
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
