name: PHP SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'sdks/php/**'
      - '.github/workflows/php-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/php/**'
      - '.github/workflows/php-ci.yml'

defaults:
  run:
    working-directory: sdks/php

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # The Laravel integration needs Laravel 11+, which needs PHP 8.2+
      - name: Drop Laravel test dependencies on PHP < 8.2
        if: matrix.php == '7.4' || matrix.php == '8.0' || matrix.php == '8.1'
        run: composer remove --dev orchestra/testbench --no-update --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run SDK tests
        run: composer test

      - name: Run Laravel integration tests
        if: matrix.php != '7.4' && matrix.php != '8.0' && matrix.php != '8.1'
        run: composer test:laravel
