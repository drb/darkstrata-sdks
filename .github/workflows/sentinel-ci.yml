name: Sentinel Solution CI

on:
  push:
    branches: [main]
    paths:
      - 'integrations/sentinel/**'
      - '.github/workflows/sentinel-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/sentinel/**'
      - '.github/workflows/sentinel-ci.yml'

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: integrations/sentinel

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: integrations/sentinel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate solution
        run: npm run validate
